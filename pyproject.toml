[project]
name = "ai-task-management-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.3",
    "apscheduler>=3.11.2",
    "asyncpg>=0.31.0",
    "bcrypt>=4.0.0",
    "celery>=5.6.2",
    "email-validator>=2.0.0",
    "fastapi>=0.128.0",
    "numpy>=1.26.0",
    "openai>=1.0.0",
    "openai-agents>=0.7.0",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "python-jose[cryptography]>=3.3.0",
    "redis>=7.1.0",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
notifications = [
    "sendgrid>=6.0.0",
    "twilio>=8.0.0",
    "firebase-admin>=6.0.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_default_fixture_loop_scope = "function"
